<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; padding: 20px; color: #333; }
        .card { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 30px; border: 1px solid #e0e0e0; }
        .code { font-size: 32px; font-weight: bold; letter-spacing: 6px; color: #2563eb; background: #eff6ff; padding: 12px 20px; border-radius: 6px; display: inline-block; margin: 20px 0; }
        .footer { font-size: 12px; color: #888; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ app_name }}</h2>
        <p>Hello,</p>
        <p>Your verification code for <strong>{{ purpose }}</strong> is:</p>
        <div style="text-align: center;">
            <span class="code">{{ otp }}</span>
        </div>
        <p>This code expires in <strong>{{ expire_minutes }} minutes</strong>. If you did not request this, please ignore this email.</p>
        <div class="footer">
            &copy; {{ app_name }}. All rights reserved.
        </div>
    </div>
</body>
</html>
